name: KristalDiag CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kristaldiag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: Self-test Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout KristalDiag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install KristalDiag and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Built-in independent v10 self-test
        run: kristaldiag self-test

  framework-v10:
    name: Independent Kristal v10 draft.3.1 gate
    needs: self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KRISTAL_FRAMEWORK_REF: fe54a88271e2ad7522abacdfbde90f9397954053
    steps:
      - name: Checkout KristalDiag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: KristalDiag
          persist-credentials: false
      - name: Checkout pinned Kristal-Framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Rejean-McCormick/Kristal-Framework
          ref: ${{ env.KRISTAL_FRAMEWORK_REF }}
          path: Kristal-Framework
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install KristalDiag
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e KristalDiag
      - name: Record exact subjects
        run: |
          mkdir -p ci-evidence
          {
            echo "KristalDiag=$(git -C KristalDiag rev-parse HEAD)"
            echo "Kristal-Framework=$(git -C Kristal-Framework rev-parse HEAD)"
            echo "Kristal-Version=$(python -c 'import json; print(json.load(open("Kristal-Framework/contracts/release.json"))["version"])')"
            python --version
          } | tee ci-evidence/subjects.txt
      - name: KristalDiag doctor
        run: kristaldiag doctor --target Kristal-Framework
      - name: Qualify Kristal v10
        run: >-
          kristaldiag conform Kristal-Framework
          --profile V10-Standard
          --control-dir "$RUNNER_TEMP/kristaldiag-v10"
      - name: Verify evidence integrity
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/kristaldiag-v10/current/summary.json" ]; then
            kristaldiag verify-run "$RUNNER_TEMP/kristaldiag-v10/current/summary.json" --require-pass
          else
            echo "No KristalDiag summary was produced."
            exit 1
          fi
      - name: Copy evidence
        if: always()
        run: |
          mkdir -p ci-evidence/kristaldiag-v10
          if [ -d "$RUNNER_TEMP/kristaldiag-v10/current" ]; then
            cp -a "$RUNNER_TEMP/kristaldiag-v10/current/." ci-evidence/kristaldiag-v10/
          fi
      - name: Upload independent conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kristaldiag-v10-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: ci-evidence/
