name: Safe recovery tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_recovery.py tests/test_c2_public_gate.py tests/test_discovery_adapter.py tests/test_operational_v10.py tests/test_content_catalog.py
      - run: python -m compileall -q kristal_manager
      - run: python -m kristal_manager --help
