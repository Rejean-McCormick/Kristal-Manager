[project]
name = "astro-signals"
version = "2.3.0"
description = "Deterministic continuous-field astrology engine, API and web application"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141.1,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyswisseph>=2.10.3.2,<3",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "hypothesis>=6,<7",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["packages/astrology-engine/src", "services/astrology-api"]
testpaths = ["packages/astrology-engine/tests", "services/astrology-api/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
