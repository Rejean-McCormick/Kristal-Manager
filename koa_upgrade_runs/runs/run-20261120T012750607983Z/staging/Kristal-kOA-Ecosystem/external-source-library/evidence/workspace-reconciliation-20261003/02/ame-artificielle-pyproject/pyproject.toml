[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ame-artificielle"
version = "0.2.0"
description = "Reference implementation of the Soul Graph / psycho-causal Artificial Soul model"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
